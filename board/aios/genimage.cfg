# AIOS — imagen de disco híbrida BIOS + UEFI (aios.img), heredada de newos.
#   sector 0     boot.img de GRUB (446 bytes, sin tocar la tabla de particiones)
#   sector 1..   grub.img (núcleo GRUB BIOS) en el hueco antes de la partición 1
#   partición 1  EFI (FAT): EFI/BOOT/bootx64.efi, boot/bzImage, boot/grub/grub.cfg
#   partición 2  raíz ext4 -> root=PARTUUID=a105a105-02

image efi-part.vfat {
	vfat {
		label = "AIOS_EFI"
		file EFI {
			image = "esp/EFI"
		}
		file boot {
			image = "esp/boot"
		}
	}
	size = 64M
}

image aios.img {
	hdimage {
		partition-table-type = "mbr"
		disk-signature = 0xa105a105
	}

	partition mbr-boot {
		in-partition-table = "no"
		image = "boot.img"
		offset = 0
		size = 512
		holes = {"(440; 512)"}
	}

	partition grub {
		in-partition-table = "no"
		image = "grub.img"
		offset = 512
	}

	partition efi {
		partition-type = 0xEF
		bootable = "true"
		image = "efi-part.vfat"
		offset = 1M
	}

	partition root {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
