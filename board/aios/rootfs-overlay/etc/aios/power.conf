# AIOS — perfil de energía automático (aios-power.service, aios sys power).
# Con batería: CPU en ahorro, menos brillo y menos hilos del modelo. Enchufado,
# todo vuelve. Tras editar: sudo aios sys power apply --force

# yes / no
ENABLED=yes

# Brillo máximo con batería, en % (si estaba más alto, baja a este; al enchufar vuelve)
BATTERY_BRIGHTNESS=60

# Hilos del modelo con batería: auto = la mitad de los núcleos; un número; o keep
# para no tocarlos. Cambiarlos reinicia el modelo (solo cuando no está respondiendo).
BATTERY_LLAMA_THREADS=auto
