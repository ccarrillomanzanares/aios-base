# AIOS — modelo local servido por llama-server (aios-llama.service).
# Tras editar: sudo systemctl restart aios-llama

# Modelo y proyector de visión, en /usr/share/aios/models. Vacíos = autodetectar
# (el primer .gguf que no sea mmproj, y el mmproj que haya).
MODEL=Qwen3.5-4B-Q4_K_M.gguf
MMPROJ=Qwen3.5-4B-mmproj-F16.gguf

# Solo en local: el agente y la interfaz hablan con 127.0.0.1.
HOST=127.0.0.1
PORT=8083

# Contexto en tokens. "auto": lo que cabe en la RAM con tope por velocidad
# (16K en el perfil mínimo de 8 GB, 32K con 12 GB o más). O un número fijo.
CTX=auto

# Hilos: "auto" = núcleos físicos (los hilos SMT no ayudan en la generación).
THREADS=auto

# Opciones extra para llama-server, tal cual.
EXTRA_ARGS=
