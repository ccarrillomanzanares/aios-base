# AIOS — tema WarGames (fósforo verde) para sway.
# Mismos colores que aios-theme en aios-lfs; 'aios ui theme' lo cambiará (hito 1).
#                       borde   fondo   texto   indicador
client.focused          #00ff66 #001a10 #00ff66 #00ff66
client.focused_inactive #00b356 #000000 #00ff66 #00ff66
client.unfocused        #00b356 #000000 #00ff66 #00ff66
client.urgent           #ff0000 #220000 #00ff66 #00ff66
client.placeholder      #00b356 #000000 #00ff66 #00ff66
client.background       #000000

bar {
    position bottom
    font pango:DejaVu Sans Mono 9
    status_command /usr/bin/aios-status
    colors {
        background #000000
        statusline #00ff66
        separator  #66ffa8
        focused_workspace  #000000 #00ff66 #000000
        active_workspace   #000000 #001a10 #00ff66
        inactive_workspace #000000 #000000 #00ff66
        urgent_workspace   #000000 #ff0000 #00ff66
        binding_mode       #000000 #00ff66 #000000
    }
}
