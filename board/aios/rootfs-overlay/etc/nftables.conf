#!/usr/sbin/nft -f
# AIOS — cortafuegos (aios-firewall.service). Sale todo; de fuera solo entran
# respuestas a conexiones abiertas desde aquí. Una tabla propia: recargar no
# toca reglas de otros (contenedores, VPN).
#
# Para abrir algo, un fichero en /etc/nftables.d/ y 'sudo systemctl reload aios-firewall'.
# Ejemplo, SSH (/etc/nftables.d/ssh.nft):
#   add rule inet aios input tcp dport 22 accept

destroy table inet aios

table inet aios {
    chain input {
        type filter hook input priority filter; policy drop;
        iif lo accept
        ct state established,related accept
        ct state invalid drop
        # IPv6 no funciona sin ICMPv6 (descubrimiento de vecinos, anuncios del router)
        meta l4proto ipv6-icmp accept
        meta l4proto icmp accept
        # DHCP: las respuestas del servidor (v4 por si no van por socket de paquetes)
        udp sport 67 udp dport 68 accept
        ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
    }
}

include "/etc/nftables.d/*.nft"
