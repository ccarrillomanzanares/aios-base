# AIOS — console=ttyS0 (para QEMU y las pruebas) crea un getty en ttyS0 también
# en portátiles sin puerto serie: agetty fallaba y se reiniciaba cada 10 s.
# Solo arranca si el puerto existe de verdad (tipo 0 = sin UART detrás).
[Service]
ExecCondition=/bin/sh -c 'read t < /sys/class/tty/%I/type && [ "$$t" != 0 ]'
